<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">KRYPTON Money Magnet</title>
<desc id="desc">Neon K and magnet emblem on a transparent background</desc>
<defs>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a02cff"/><stop offset=".46" stop-color="#315cff"/><stop offset="1" stop-color="#30e5ff"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7c3cff"/><stop offset=".48" stop-color="#174eff"/><stop offset="1" stop-color="#25dfff"/>
  </linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#8c93a6"/><stop offset="1" stop-color="#e7ebff"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<circle cx="256" cy="256" r="213" fill="none" stroke="url(#ring)" stroke-width="8" opacity=".98" filter="url(#glow)"/>
<circle cx="256" cy="256" r="195" fill="none" stroke="#6b54ff" stroke-width="1.4" opacity=".45"/>
<!-- horseshoe magnet -->
<path d="M113 183 C113 135 151 103 199 103 H273 V165 H202 C183 165 169 178 169 197 V315 C169 334 183 347 202 347 H273 V409 H197 C149 409 113 373 113 325 Z"
      fill="url(#metal)" stroke="#6fe8ff" stroke-width="3" filter="url(#soft)"/>
<path d="M112 184 C112 136 150 101 199 101 H276" fill="none" stroke="#da6cff" stroke-width="4" opacity=".7"/>
<rect x="260" y="105" width="58" height="61" rx="9" fill="url(#silver)" stroke="#d8e4ff" stroke-width="3"/>
<rect x="260" y="346" width="58" height="61" rx="9" fill="url(#silver)" stroke="#d8e4ff" stroke-width="3"/>
<!-- K -->
<path d="M286 104 H353 L248 251 L365 407 H294 L184 257 Z" fill="url(#metal)" stroke="#77eaff" stroke-width="3" filter="url(#soft)"/>
<path d="M349 111 L255 251 L359 397" fill="none" stroke="#fff" stroke-width="3" opacity=".78"/>
<path d="M286 107 L203 247" fill="none" stroke="#c24fff" stroke-width="4" opacity=".82"/>
</svg>